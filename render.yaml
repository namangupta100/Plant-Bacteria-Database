services:
  - type: web
    name: plant-bacteria-database
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn build.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pbd-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: plant-bacteria-database-xcns.onrender.com,.onrender.com
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: pbd-db
    plan: free
    databaseName: pbd_db
    user: pbd_db_user
