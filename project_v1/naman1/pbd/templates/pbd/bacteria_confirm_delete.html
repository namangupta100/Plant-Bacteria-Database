{% extends 'pbd/base.html' %}

{% block title %}Delete Bacteria Entry{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4 text-danger">
                    <i class="fas fa-trash-alt me-2"></i>Delete Bacteria Entry
                </h2>
                <p class="lead text-center">Are you sure you want to delete <strong>{{ object.genus }} {{ object.species }} ({{ object.strain }})</strong>?</p>
                <p class="text-muted text-center">This action cannot be undone.</p>
                <form method="post" class="text-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        <i class="fas fa-trash-alt me-1"></i>Delete
                    </button>
                    <a href="{% url 'bacteria_detail' object.id %}" class="btn btn-secondary">
                        <i class="fas fa-times me-1"></i>Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
